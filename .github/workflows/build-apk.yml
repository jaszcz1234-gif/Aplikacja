name: Build APK
on:
  workflow_dispatch:
jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - run: unzip -q "$(find . -name '*.zip' | head -1)" && sed -i 's/Capacitor.registerPlugin("RouterOsApi")/Capacitor.Plugins.RouterOsApi/' mikrotik-app/www/ros.js
      - run: chmod +x setup-android.sh && ./setup-android.sh
        working-directory: mikrotik-app
      - run: chmod +x gradlew && ./gradlew assembleDebug
        working-directory: mikrotik-app/android
      - uses: actions/upload-artifact@v4
        with:
          name: mikrotik-kontrola-apk
          path: mikrotik-app/android/app/build/outputs/apk/debug/app-debug.apk
